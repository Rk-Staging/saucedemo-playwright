name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '30 20 * * *' # 20:30 UTC = 2:00 AM IST (nightly)
  workflow_dispatch: # allow manual run from Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://www.saucedemo.com
      STANDARD_USER: ${{ secrets.STANDARD_USER || 'standard_user' }}
      LOCKED_USER: ${{ secrets.LOCKED_USER || 'locked_out_user' }}
      PROBLEM_USER: ${{ secrets.PROBLEM_USER || 'problem_user' }}
      PASSWORD: ${{ secrets.PASSWORD || 'secret_sauce' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
